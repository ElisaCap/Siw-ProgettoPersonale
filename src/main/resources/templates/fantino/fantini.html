<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <link rel="stylesheet" href="/css/cavallo.css">
    <title>Fantini</title>
</head>
<body>
  <!-- BARRA SUPERIORE -->
  <div class="top-bar">
    <div class="logo-text">Palio di Siena</div>
    <form th:action="@{/home}" method="get">
      <button class="btn" type="submit">Home</button>
    </form>
    <div class="user-controls">
      <div sec:authorize="isAuthenticated()">
        <span class="user-name" th:text="${#authentication.name}">Utente</span>
        <form th:action="@{/logout}" method="post" style="display: inline;">
          <button type="submit" class="btn">Logout</button>
        </form>
      </div>
      <div sec:authorize="!isAuthenticated()">
        <form th:action="@{/login}" method="get" style="display: inline;">
          <button type="submit" class="btn">Login</button>
        </form>
      </div>
	  <form th:action="@{/home}" method="get" style="display: inline;">
	            <button type="submit" class="btn">Home</button>
	          </form>
    </div>
  </div>

  <!-- BOTTONE AGGIUNGI -->
  <div sec:authorize="hasRole('ADMIN')" style="margin: 1rem;">
    <form th:action="@{/insFantino}" method="get">
      <button class="btn-add" type="submit">+</button>
    </form>
  </div>

  <!-- TITOLO -->
  <h1 class="main-title">Ecco tutti i fantini registrati</h1>

  <!-- CARD CONTAINER -->
  <div class="card-container">
    <a class="card-cavallo" th:each="fantino : ${fantini}"
       th:href="@{/fantini/{id}(id=${fantino.id})}"
       th:style="'background-image: url(/fantini/' + ${fantino.id} + '/immagine)'">
      <div class="card-overlay">
        <h2 th:text="${fantino.nome} + ' ' + ${fantino.cognome}">Nome Fantino</h2>
        <p><strong>ID:</strong> <span th:text="${fantino.id}">1</span></p>
        <p><strong>Data di nascita:</strong> <span th:text="${fantino.dataNascita}">01/01/1970</span></p>
      </div>
    </a>
  </div>

</body>
</html>
