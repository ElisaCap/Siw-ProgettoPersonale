<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <link rel="stylesheet" href="/css/cavallo.css">
    <title>Fantini</title>
</head>
<body>
	<!-- BARRA SUPERIORE -->
		<div class="top-bar">
		  <div class="logo-text">Palio di Siena</div>

		  <div class="user-controls">
		    <div sec:authorize="isAuthenticated()">
		      <span class="user-name" th:text="${#authentication.name}">Utente</span>
		      <form th:action="@{/logout}" method="post" style="display: inline;">
		        <button type="submit" class="btn">Logout</button>
		      </form>
		    </div>
		    <div sec:authorize="!isAuthenticated()">
		      <form th:action="@{/login}" method="get" style="display: inline;">
		        <button type="submit" class="btn">Login</button>
		      </form>
		    </div>
		  </div>
		</div>
	   <div sec:authorize="hasRole('ADMIN')">
		<form th:action="@{/insFantino}" method="get">
         <button type="submit">+</button>
		 </div>
    <h1 class="titolo">Ecco tutti i fantini registrati</h1>

    <table class="elenco">
        <tr>
            <td>Id</td>
            <td>Nome</td>
            <td>Cognome</td>
            <td>Data di nascita</td>
            <td>Foto</td>
            <td>Azioni</td>
        </tr>

        <tr th:each="fantino : ${fantini}">
            <td th:text="${fantino.id}"></td>
            <td th:text="${fantino.nome}"></td>
            <td th:text="${fantino.cognome}"></td>
            <td th:text="${fantino.dataNascita}"></td>
            <td>
                <img width="30%" th:src="@{/fantini/{id}/immagine(id=${fantino.id})}" alt="Foto Fantino"/>
            </td>
            <td>
                <form th:action="@{/fantini/{id}(id=${fantino.id})}" method="get">
                    <button type="submit">Vedi info</button>
                </form>

                <div sec:authorize="hasRole('ADMIN')">
					
                    <form th:action="@{/fantini/delete/{id}(id=${fantino.id})}" method="get"
                          onsubmit="return confirm('Sei sicuro di voler eliminare questo fantino?');">
                        <button type="submit">Elimina</button>
                    </form>
					<form th:action="@{/fantini/modifica/{id}(id=${fantino.id})}" method="get">
					             <button type="submit">Modifica</button>
					</form>
                </div>
            </td>
        </tr>
    </table>
</body>
</html>
