<!DOCTYPE html>
<html>
	<head>
			<title>Nuovo Fantino</title>
			<link rel="stylesheet" href="/css/insCavallo.css"/>
		</head>
		<body>
			<!-- BARRA SUPERIORE -->
				<div class="top-bar">
				  <div class="header-content">
				    <div class="logo-text">Palio di Siena</div>
				    <div class="user-controls">
						<form th:action="@{/home}" method="get" style="display: inline;">
						         <button class="btn" type="submit">Home</button>
						       </form>
				      <div sec:authorize="isAuthenticated()">
				        <span class="user-name" th:text="${#authentication.name}">Utente</span>
				        <form th:action="@{/logout}" method="post" style="display: inline;">
				          <button type="submit" class="btn">Logout</button>
				        </form>
				      </div>
				      <div sec:authorize="!isAuthenticated()">
				        <form th:action="@{/login}" method="get" style="display: inline;">
				          <button type="submit" class="btn">Login</button>
				        </form>
				      </div>
				    </div>
				  </div>
				</div>

			<div><a href="/"></a></div>
			<h1 class="main-title">Aggiungi un fantino</h1>
			<form th:action="@{/salvaFantino}" method="post" th:object="${fantino}" enctype="multipart/form-data" class="form-cavallo">
			  <input type="hidden" th:field=${fantino.id} th:value=${id} />  
			    <div>
			        Nome: <span><input required type="text" th:field="${fantino.nome}"/></span>
			        <span th:text="${msgErrTitle}">Campo Obbligatorio</span>
			    </div>
			    <div>
			        Cognome: <span><input required type="text" th:field="${fantino.cognome}"/></span>
			        <span th:text="${msgErrYear}">Campo Obbligatorio</span>
			    </div>
				<div>
							        Data di nascita: 					<span>			<input type="date"
													       th:field="${fantino.dataNascita}"
													       th:attr="min=${minDate}, max=${maxDate}"
													       required /></div>
							    <div></span>
									<a th:text="|data attuale: ${fantino.dataNascita}|"></a>
			        <span th:text="${msgErrYear}">Campo Obbligatorio</span>
			    </div>
			    <div>
			        immagine: <span>
			            <input type="file" th:field="*{fileImmagine}" accept="image/*" />
			        </span>
			    </div>
			    <div>
			        <span><button type="submit" class="btn">Conferma</button></span>
			    </div>
			</form>
		</body>	


</html>
