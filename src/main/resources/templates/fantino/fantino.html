<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="it">
<head>
  <meta charset="UTF-8">
  <title>Dettagli Fantino</title>
  <link rel="stylesheet" href="/css/cav.css">
</head>

<body>
  <!-- HEADER -->
  <header class="top-bar">
    <div class="header-content">
      <div class="logo-text">Palio di Siena</div>
      <div class="user-controls">
        <!-- Home -->
        <form th:action="@{/home}" method="get" style="display: inline;">
          <button class="btn" type="submit">Home</button>
        </form>

        <!-- Autenticato -->
        <div sec:authorize="isAuthenticated()" style="display: inline;">
          <span class="user-name" th:text="${#authentication.name}"></span>
          <form th:action="@{/logout}" method="post" style="display: inline;">
            <button class="btn" type="submit">Logout</button>
          </form>
        </div>

        <!-- Non autenticato -->
        <div sec:authorize="!isAuthenticated()" style="display: inline;">
          <form th:action="@{/login}" method="get" style="display: inline;">
            <button class="btn" type="submit">Login</button>
          </form>
        </div>
      </div>
    </div>
  </header>

  <!-- TITOLO -->
  <h1 class="uno">Dati Fantino</h1>

  <!-- CONTENUTO PRINCIPALE -->
  <div th:if="${fantino}" class="card-cavallo">
    <img th:src="@{/fantini/{id}/immagine(id=${fantino.id})}" alt="Foto Fantino">

    <div class="card-dato">
      <p class="definizione">Nome</p>
      <p class="nome" th:text="${fantino.nome}"></p>
    </div>

    <div class="card-dato">
      <p class="definizione">Cognome</p>
      <p class="nome" th:text="${fantino.cognome}"></p>
    </div>

    <div class="card-dato">
      <p class="definizione">Data di Nascita</p>
      <p class="nome" th:text="${fantino.dataNascita}"></p>
    </div>

    <!-- Bottoni -->
    <div class="azionibtn">
      <form th:action="@{/partFantino/{id}(id=${fantino.id})}" method="get">
        <button type="submit" class="btn-card secondary">Vedi Partecipazioni</button>
      </form>

      <div sec:authorize="hasRole('ADMIN')">
        <form th:action="@{/fantini/delete/{id}(id=${fantino.id})}" method="get"
              onsubmit="return confirm('Sei sicuro di voler eliminare questo fantino?');">
          <button type="submit" class="btn-card danger">Elimina</button>
        </form>

        <form th:action="@{/fantini/modifica/{id}(id=${fantino.id})}" method="get">
          <button type="submit" class="btn-card secondary">Modifica</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Caso: Fantino non trovato -->
  <div th:unless="${fantino}">
    <h2 class="uno">Errore</h2>
  </div>
  
  <form th:action="@{/fantini/cercatutti}" method="get" style="text-align: center; margin-top: 20px;">
   	    <button type="submit" class="btn">Torna alla lista</button>
   	</form>

  
</body>
</html>
