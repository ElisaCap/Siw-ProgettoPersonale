<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<link rel="stylesheet" href="/css/cavallo.css">
	<title>fantino</title>
</head>



<!-- BARRA SUPERIORE -->
	  <div class="top-bar">
	    <div class="logo-text">Palio di Siena</div>
		<form th:action="@{/home}" method="get">
			<button class="btn" type="submit">home</button>
		</form>
	    <div class="user-controls">
	      <div sec:authorize="isAuthenticated()">
	        <span class="user-name" th:text="${#authentication.name}">Utente</span>
	        <form th:action="@{/logout}" method="post" style="display: inline;">
	          <button type="submit" class="btn">Logout</button>
	        </form>
	      </div>
	      <div sec:authorize="!isAuthenticated()">
	        <form th:action="@{/login}" method="get" style="display: inline;">
	          <button type="submit" class="btn">Login</button>
	        </form>
	      </div>
	    </div>
	  </div>





<body>
	<div th:if="${fantino}">
		<h1 class="uno">Dati fantino</h1>
		<a class="box">
		<p class="definizione">Id fantino</p>
		<p class="nome" th:text="${fantino.id}"></p>
		</a>
		<a class="box">
		<p class="definizione">Nome fantino</p>
		<p class="nome" th:text="${fantino.nome}">
		</p>
		</a>
		<a class="box">
		<p class="definizione">Cognome fantino</p>
		<p class="nome" th:text="${fantino.cognome}"></p>
		</a>	
		<a class="box">
				<p class="definizione">Data di nascita Fantino</p>
				<p class="nome" th:text="${fantino.dataNascita}"></p>
				</a>	
		<a class="box">
		<p class="definizione">Foto fantino:</p>
		<img width="30%" th:src="@{/fantini/{id}/immagine(id=${fantino.id})}" alt="Foto Fantino"/>
		</a>
	</div>
	
	<form th:action="@{/partFantino/{id}(id=${fantino.id})}" method="get">
		<button type="submit">vedi partecipazioni</button>
	</form>

	
	<div th:unless="${fantino}">
		<p>fantino non trovato</p>
	</div>
</body>

</html>
