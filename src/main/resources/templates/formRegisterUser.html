<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head>
    <meta charset="UTF-8">
    <title>Registrazione</title>
    <link rel="stylesheet" th:href="@{/css/login.css}" />
</head>
<body>
<main class="login-container">
    <h1 class="login-title">Registrazione nuovo utente</h1>

    <form th:action="@{/register}" method="post">

        <!-- USER OBJECT -->
        <div th:object="${user}">
            <div class="login-field">
                <label for="name">Nome:</label>
                <input type="text" id="name" th:field="*{name}" placeholder="Nome"/>
                <span class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
            </div>

            <div class="login-field">
                <label for="surname">Cognome:</label>
                <input type="text" id="surname" th:field="*{surname}" placeholder="Cognome"/>
                <span class="error" th:if="${#fields.hasErrors('surname')}" th:errors="*{surname}"></span>
            </div>
			
			<div class="login-field">
			               <label for="email">Email:</label>
			               <input type="email" id="email" th:field="*{email}" placeholder="Email"/>
			               <span class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
			           </div>
        </div>

        <!-- CREDENTIALS OBJECT -->
        <div th:object="${credentials}">
            <div class="login-field">
                <label for="username">Username:</label>
                <input type="text" id="username" th:field="*{username}" placeholder="Username"/>
                <span class="error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span>
            </div>

           

            <div class="login-field">
                <label for="password">Password:</label>
                <input type="password" id="password" th:field="*{password}" placeholder="Password"/>
                <span class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
            </div>
        </div>

        <div class="login-buttons">
            <button class="btn" type="submit">Registrati</button>
            <a class="btn secondary" th:href="@{/login}">Hai già un account?</a>
        </div>

    </form>
</main>
</body>
</html>
