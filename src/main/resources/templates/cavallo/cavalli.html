<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="it">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/cavallo.css">
  <title>Cavalli - Palio di Siena</title>
</head>

<body>

  <!-- HEADER -->
  <header class="top-bar">
    <div class="header-content">
      <div class="logo-text">Palio di Siena</div>
      <div class="user-controls">

        <!-- Home -->
        <form th:action="@{/home}" method="get">
          <button class="btn" type="submit">Home</button>
        </form>

        <!-- Autenticato -->
        <div sec:authorize="isAuthenticated()">
          <span class="user-name" th:text="${#authentication.name}"></span>
          <form th:action="@{/logout}" method="post">
            <button class="btn" type="submit">Logout</button>
          </form>
        </div>

        <!-- Non autenticato -->
        <div sec:authorize="!isAuthenticated()">
          <form th:action="@{/login}" method="get">
            <button class="btn" type="submit">Login</button>
          </form>
        </div>
      </div>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main>
    <h1 class="main-title">Ecco tutti i cavalli registrati</h1>

    <div class="card-container">

      <!-- Card per aggiunta (solo admin) -->
      <div class="card-edizione add-card" sec:authorize="hasRole('ADMIN')">
        <form th:action="@{/insCavallo}" method="get" class="add-card-form">
          <button type="submit" class="plus-sign">+</button>
        </form>
      </div>

      <!-- Cards Cavalli -->
      <a class="card-edizione" th:each="cavallo : ${cavalli}"
         th:href="@{/cavalli/{id}(id=${cavallo.id})}"
         th:style="'background-image: url(/cavalli/' + ${cavallo.id} + '/immagine)'">
        <div class="card-overlay">
          <h2 th:text="${cavallo.nome}">Nome Cavallo</h2>
          <p><strong>ID:</strong> <span th:text="${cavallo.id}">1</span></p>
          <p><strong>Razza:</strong> <span th:text="${cavallo.razza}">Sella</span></p>
        </div>
      </a>

    </div>
  </main>
</body>
</html>
