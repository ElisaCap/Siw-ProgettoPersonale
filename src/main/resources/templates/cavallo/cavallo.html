<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<link rel="stylesheet" href="/style2.css">
	<title>Cavallo</title>
</head>

<body>
	<div th:if="${cavallo}">
		<h1 class="uno">Dati cavallo</h1>
		<a class="box">
		<p class="definizione">Id cavallo</p>
		<p class="nome" th:text="${cavallo.id}"></p>
		</a>
		<a class="box">
		<p class="definizione">Nome cavallo</p>
		<p class="nome" th:text="${cavallo.nome}">
		</p>
		</a>
		<a class="box">
		<p class="definizione">Razza cavallo</p>
		<p class="nome" th:text="${cavallo.razza}"></p>
		</a>		
		<a class="box">
		<p class="definizione">Foto cavallo:</p>
		<div><img width="30%" th:src="${cavallo.immagine}" /></div>
		</a>
		
		<form th:action="@{/edizioniCavallo/{id}(id=${cavallo.id})}" method="get">
		
			<button type="submit">
						vedi edizioni
					</button>
		</form>
	
		
		
	</div>
	<div th:unless="${cavallo}">
		<p>cavallo non trovato</p>
	</div>
	
	
</body>

</html>
