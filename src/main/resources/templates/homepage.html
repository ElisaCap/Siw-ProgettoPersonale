<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="it">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Homepage Palio di Siena</title>
  <link rel="stylesheet" href="/css/home.css" />
</head>

<body>

  <!-- Barra superiore fissa -->
  <header class="top-bar">
    <div class="logo-text">Palio di Siena</div>

    <div class="user-controls">
      <div sec:authorize="isAuthenticated()">
        <span class="user-name" th:text="${#authentication.name}"></span>
        <form th:action="@{/logout}" method="post" style="display: inline;">
          <button class="btn" type="submit">Logout</button>
        </form>
      </div>

      <div sec:authorize="!isAuthenticated()">
        <form th:action="@{/login}" method="get" style="display: inline;">
          <button class="btn" type="submit">Login</button>
        </form>
      </div>
    </div>
  </header>

  <!-- Contenuto principale -->
  <main>
    <h1 class="uno">Homepage</h1>

	<div class="content">
	  <form th:action="@{/cavalli/cercatutti}" method="get" class="action-card card-cavalli">
	    <button type="submit">Mostra tutti i cavalli</button>
	  </form>

	  <form th:action="@{/contrade}" method="get" class="action-card card-contrade">
	    <button type="submit">Mostra tutte le contrade</button>
	  </form>

	  <form th:action="@{/fantini/cercatutti}" method="get" class="action-card card-fantini">
	    <button type="submit">Mostra tutti i fantini</button>
	  </form>

	  <form th:action="@{/edizioni}" method="get" class="action-card card-edizioni">
	    <button type="submit">Mostra tutte le edizioni</button>
	  </form>
	</div>

	
  </main>



</body>

</html>
