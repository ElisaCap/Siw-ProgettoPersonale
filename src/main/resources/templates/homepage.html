<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Homepage Palio di Siena</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/home.css" />
</head>
<body>
	<!-- Top bar -->
	<header class="top-bar">
	  <div class="header-content">
	    <div class="logo-text">Palio di Siena</div>

	    <div class="user-controls">
	      <form action="/home" method="get">
	        <button class="btn" type="submit">Home</button>
	      </form>

	      <!-- Se l'utente è autenticato -->
	      <div sec:authorize="isAuthenticated()">
	        <span class="user-name" th:text="${#authentication.name}">Utente</span>
	        <form th:action="@{/logout}" method="post">
	          <button class="btn" type="submit">Logout</button>
	        </form>
	      </div>

	      <!-- Se l'utente NON è autenticato -->
	      <div sec:authorize="!isAuthenticated()">
	        <form th:action="@{/login}" method="get">
	          <button class="btn" type="submit">Login</button>
	        </form>
	      </div>
	    </div>
	  </div>
	</header>

  <!-- Main -->
  <main>
    <h1 class="main-title">Benvenuto al Palio di Siena</h1>

    <div class="content">
      <a href="/edizioni" class="action-card card-edizioni large">
        <span class="card-text">Edizioni</span>
      </a>
      <a href="/cavalli/cercatutti" class="action-card card-cavalli">
        <span class="card-text">Cavalli</span>
      </a>
      <a href="/contrade" class="action-card card-contrade">
        <span class="card-text">Contrade</span>
      </a>
      <a href="/fantini/cercatutti" class="action-card card-fantini">
        <span class="card-text">Fantini</span>
      </a>
    </div>
  </main>

  <footer>
    © 2025 Palio di Siena. Tutti i diritti riservati.
  </footer>
</body>
</html>
