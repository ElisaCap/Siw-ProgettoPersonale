<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Homepage Palio di Siena</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/home.css" />
</head>
<body>

  <!-- Top bar: invariata -->
  <header class="top-bar">
    <div class="header-content">
      <div class="logo-text">Palio di Siena</div>
      <div class="user-controls">
        <form action="/home" method="get">
          <button class="btn" type="submit">Home</button>
        </form>
        <div sec:authorize="isAuthenticated()">
          <span class="user-name" th:text="${#authentication.name}">Utente</span>
          <form th:action="@{/logout}" method="post">
            <button class="btn" type="submit">Logout</button>
          </form>
        </div>
        <div sec:authorize="!isAuthenticated()">
          <form th:action="@{/login}" method="get">
            <button class="btn" type="submit">Login</button>
          </form>
        </div>
      </div>
    </div>
  </header>

  <!-- Nuovo layout -->
  <main class="homepage-container">
    <h1 class="homepage-title">Benvenuto al Palio di Siena</h1>

    <div class="card-grid">
      <a href="/edizioni" class="home-card home-edizioni">
        <span class="card-label">Edizioni</span>
      </a>
      <a href="/cavalli/cercatutti" class="home-card home-cavalli">
        <span class="card-label">Cavalli</span>
      </a>
      <a href="/contrade" class="home-card home-contrade">
        <span class="card-label">Contrade</span>
      </a>
      <a href="/fantini/cercatutti" class="home-card home-fantini">
        <span class="card-label">Fantini</span>
      </a>
    </div>
  </main>

 

</body>
</html>
