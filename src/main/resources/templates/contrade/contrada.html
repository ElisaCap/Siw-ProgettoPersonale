<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="it">
<head>
    <meta charset="UTF-8">
    <title>Contrada</title>
    <link rel="stylesheet" href="/css/cav.css" />
</head>
<body>
    <!-- HEADER -->
    <header class="top-bar">
        <div class="header-content">
            <div class="logo-text">Palio di Siena</div>
            <div class="user-controls">
                <form th:action="@{/home}" method="get" style="display: inline;">
                    <button class="btn" type="submit">Home</button>
                </form>

                <div sec:authorize="isAuthenticated()" style="display: inline;">
                    <span class="user-name" th:text="${#authentication.name}">Utente</span>
                    <form th:action="@{/logout}" method="post" style="display: inline;">
                        <button class="btn" type="submit">Logout</button>
                    </form>
                </div>

                <div sec:authorize="!isAuthenticated()" style="display: inline;">
                    <form th:action="@{/login}" method="get" style="display: inline;">
                        <button class="btn" type="submit">Login</button>
                    </form>
                </div>
            </div>
        </div>
    </header>

    <!-- TITOLO -->
    <h1 class="uno">Dettagli Contrada</h1>

    <!-- CONTENUTO PRINCIPALE -->
    <div th:if="${contrada}" class="card-cavallo">
        <!-- Immagine -->
        <img th:src="@{'/urlImmagine/' + ${contrada.id}}" alt="Immagine Contrada" />

        <!-- Nome -->
        <div class="card-dato">
            <p class="definizione">Nome</p>
            <p class="nome" th:text="${contrada.nome}">Nome Contrada</p>
        </div>

        <!-- Descrizione -->
		<div class="card-dato">
		    <p class="definizione">Descrizione</p>
		    <p class="nome" th:text="${contrada.descrizioneLunga}">Descrizione lunga della contrada</p>
			

		</div>
		<div class="card-dato">
		<p class="definizione">Contrade rivali</p>
					<div th:each="rivale : ${contrada.contradeRivali}">
					    <a th:href="@{/contrade/{id}(id=${rivale.id})}" th:text="${rivale.nome}"></a>
						<div sec:authorize="hasRole('ADMIN')">
						<form th:action="@{/eliminaRivali/{id}/{idc}(id=${contrada.id}, idc=${rivale.id})}" method="post"
					>
							<button type="submit">elimina</button>
							
						</form>
						</div>
					</div>
		</div>
        <!-- Bottoni -->
        <div class="azionibtn">
            <form th:action="@{/contrade}" method="get">
                <button type="submit" class="btn-card secondary">Vedi tutte</button>
            </form>

            <form th:action="@{/partContrada/{id}(id=${contrada.id})}" method="get">
                <button type="submit" class="btn-card secondary">Vedi partecipazioni</button>
            </form>

            <div sec:authorize="hasRole('ADMIN')">
                <form th:action="@{/eliminaContrada/{id}(id=${contrada.id})}" method="get"
                      onsubmit="return confirm('Sei sicuro di voler eliminare questa contrada?');">
                    <button type="submit" class="btn-card danger">Elimina</button>
                </form>

                <form th:action="@{/modificaContrada/{id}(id=${contrada.id})}" method="get">
                    <button type="submit" class="btn-card danger">Modifica</button>
                </form>
				<form th:action="@{/aggiungiRivale/{id}(id=${contrada.id})}" method="get">
				                    <button type="submit" class="btn-card danger">Aggiungi Rivale</button>
				 </form>
            </div>
        </div>
    </div>

    <!-- Caso: Contrada non trovata -->
    <div class="uno" th:unless="${contrada}">
        <p>Contrada non trovata</p>
    </div>
</body>
</html>
