<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="/css/cavallo.css" />
  <title>Contrade - Palio di Siena</title>
</head>

<body>

	<!-- HEADER -->
	<header class="top-bar">
	  <div class="header-content">
	    <div class="logo-text">Palio di Siena</div>
	    <div class="user-controls">

	      <!-- Home -->
	      <form th:action="@{/home}" method="get" style="display: inline;">
	        <button class="btn" type="submit">Home</button>
	      </form>

	      <!-- Autenticato -->
	      <div sec:authorize="isAuthenticated()" style="display: inline;">
	        <span class="user-name" th:text="${#authentication.name}"></span>
	        <form th:action="@{/logout}" method="post" style="display: inline;">
	          <button class="btn" type="submit">Logout</button>
	        </form>
	      </div>

	      <!-- Non autenticato -->
	      <div sec:authorize="!isAuthenticated()" style="display: inline;">
	        <form th:action="@{/login}" method="get" style="display: inline;">
	          <button class="btn" type="submit">Login</button>
	        </form>
	      </div>
	    </div>
	  </div>
	</header>

  <!-- TITOLO -->
  <h1 class="main-title">Ecco tutte le contrade registrate</h1>

  <!-- CARD CONTAINER -->
  <div class="card-container" id="contrada">
    <a id="contrada" class="card-cavallo" th:each="contrada : ${contrade}"
       th:href="@{/contrade/{id}(id=${contrada.id})}"
       th:style="'background-image: url(/urlImmagine/' + ${contrada.id} + ')'">
      <div class="card-overlay">
        <h2 th:text="${contrada.nome}">Nome Contrada</h2>
        <p><strong>Descrizione:</strong> <span th:text="${contrada.descrizione}">Descrizione contrada</span></p>
      </div>
    </a>
  </div>

</body>
</html>
