<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="/css/contrade.css" />
  <title>Contrade - Palio di Siena</title>
</head>

<body>
  <!-- BARRA SUPERIORE -->
  <div class="top-bar">
    <div class="header-content">
      <div class="logo-text">Palio di Siena</div>

      <form th:action="@{/home}" method="get">
        <button class="btn" type="submit">Home</button>
      </form>

      <div class="user-controls">
        <div sec:authorize="isAuthenticated()">
          <span class="user-name" th:text="${#authentication.name}">Utente</span>
          <form th:action="@{/logout}" method="post">
            <button class="btn" type="submit">Logout</button>
          </form>
        </div>

        <div sec:authorize="!isAuthenticated()">
          <form th:action="@{/login}" method="get">
            <button class="btn" type="submit">Login</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- TITOLO -->
  <h1 class="main-title">Ecco tutte le contrade registrate</h1>

  <!-- CARD CONTAINER -->
  <div class="card-container">
    <a class="card-cavallo" th:each="contrada : ${contrade}"
       th:href="@{/contrade/{id}(id=${contrada.id})}"
       th:style="'background-image: url(/urlImmagine/' + ${contrada.id} + ')'">
      <div class="card-overlay">
        <h2 th:text="${contrada.nome}">Nome Contrada</h2>
        <p><strong>ID:</strong> <span th:text="${contrada.id}">1</span></p>
        <p><strong>Descrizione:</strong> <span th:text="${contrada.descrizione}">Descrizione contrada</span></p>
      </div>
    </a>
  </div>

</body>
</html>
