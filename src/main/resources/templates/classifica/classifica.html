<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" href="/css/cavallo.css">
    <title>elementoClassifica</title>
</head>
<body>
		<div class="top-bar">
		  <div class="logo-text">Palio di Siena</div>

		  <div class="user-controls">
		    <div sec:authorize="isAuthenticated()">
		      <span class="user-name" th:text="${#authentication.name}">Utente</span>
		      <form th:action="@{/logout}" method="post" style="display: inline;">
		        <button type="submit" class="btn">Logout</button>
		      </form>
		    </div>
		    <div sec:authorize="!isAuthenticated()">
		      <form th:action="@{/login}" method="get" style="display: inline;">
		        <button type="submit" class="btn">Login</button>
		      </form>
		    </div>
		  </div>
		</div>
		<form th:action="@{/insElemento/{id}(id=${classifica.edizioneId})}" method="get">
		    <input type="hidden" name="posizione" 
		           th:value="${elementoClassifica != null ? elementoClassifica.posizione ?: 0 : 0}" />
		    <button type="submit">+</button>
		</form>

    <h1 class="uno">Ecco la classifica dell'edizione</h1>

    <table class="elenco">
        <tr>
			<th>Piazzamento</th>
            <th>NomeCavallo</th>
            <th>Nome Fantino</th>
			<th>Contrada</th>
            <th>Foto</th>
        </tr>

        <!-- Visualizza un semplice messaggio se la lista è vuota -->
        <tr th:if="${#lists.isEmpty(elementiClassifica)}">
            <td colspan="3">Nessun dato trovato</td>
        </tr>

        <!-- Iterazione corretta sugli elementi della lista -->
        <tr th:each="elementoClassifica : ${elementiClassifica}">
			<td th:text="${elementoClassifica.posizione}">NomeCavallo</td>

            <td th:text="${elementoClassifica.partecipazione.cavallo.nome}">NomeCavallo</td>
			
			
			<td th:text="${elementoClassifica.partecipazione.fantino.nome}+ 
			${elementoClassifica.partecipazione.fantino.cognome} 
			">NomeFantino</td>
			
			<td th:text="${elementoClassifica.partecipazione.contrada.nome}">Contrada</td>

            <td th:text="${elementoClassifica.classifica.edizione.data}">Data</td>
            <td>Foto (questa colonna può essere aggiunta più tardi)</td>
			<td>
				<form th:action="@{/eliminaElementoClassifica/{id}/{idc}(id=${elementoClassifica.id}, idc=${classifica.edizioneId})}" method="post">
		<button type="submit">elimina</button>
		</form>
			</td>
			
			
			<td>
				<form th:action="@{/insElemento/{id}(id=${classifica.edizioneId})}" method="get">
				    <input type="hidden" th:name="posizione" th:value="${elementoClassifica.posizione}" />
				    <button type="submit">+</button>
				</form>
				
				
			</td>
        </tr>
    </table>
	<form th:action="@{/modificaClassifica/{id}(id=${classifica.edizioneId})}" method="get">
		<button type="submit">
			modifica
		</button>
		
	</form>
	
	
	<table class="elenco">
	    <thead>
	      <tr class="riga-intestazione">
	        <th class="col-id">Cavallo</th>
	        <th class="col-cavallo">Fantino</th>
	        <th class="col-fantino">Contrada</th>
			<th class="col-info">Data edizione</th>

	        <th class="col-contrada">Posizionamento</th>
	        <th sec:authorize="hasRole('ADMIN')">Azioni</th>
	      </tr>
		  
	    </thead>
	    <tbody>
	      <tr class="riga-cavallo" th:each="partecipazione : ${partecipazioni}">
			<div th:unless="${partecipazione.elementoClassifica}">

			<td class="col-id" th:text="${partecipazione.cavallo.nome}"></td>
	        <td class="col-nome" 
			th:text="|${partecipazione.fantino.nome} ${partecipazione.fantino.cognome}|
			"></td>
	        <td class="col-razza" th:text="${partecipazione.contrada.nome}"></td>
			<td class="col-razza" th:text="${partecipazione.edizione.data}"></td>

				
				<div th:unless="${partecipazione.elementoClassifica}">
								<td class="col-info" th:text="'non ha tagliato il traguardo'">
									</td>
								
			
	  
	      </tr>
	    </tbody>
		</div>
	  </table>

</body>
</html>
