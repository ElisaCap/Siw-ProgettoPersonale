<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <title>Classifica</title>
    <link rel="stylesheet" href="/css/classifica.css">
</head>

<body>
    <!-- HEADER -->
    <header class="top-bar">
        <div class="header-content">
            <div class="logo-text">Palio di Siena</div>
            <div class="user-controls">
                <form th:action="@{/home}" method="get" style="display: inline;">
                    <button class="btn" type="submit">Home</button>
                </form>

                <div sec:authorize="isAuthenticated()" style="display: inline;">
                    <span class="user-name" th:text="${#authentication.name}"></span>
                    <form th:action="@{/logout}" method="post" style="display: inline;">
                        <button class="btn" type="submit">Logout</button>
                    </form>
                </div>

                <div sec:authorize="!isAuthenticated()" style="display: inline;">
                    <form th:action="@{/login}" method="get" style="display: inline;">
                        <button class="btn" type="submit">Login</button>
                    </form>
                </div>
            </div>
        </div>
    </header>

    <!-- CLASSIFICA -->
	<div th:if="${classifica}">
    <div class="section-wrapper">
        <h1 class="section-title" th:text="|Ecco la classifica dell'edizione del ${classifica.edizione.data}|"></h1>

        <!-- Pulsante aggiungi in cima -->
        <div class="card-controls" sec:authorize="hasRole('ADMIN')">
            <form th:action="@{/insElemento/{id}(id=${classifica.edizioneId})}" method="get">
                <input type="hidden" name="posizione" value="0" />
                <button class="btn btn-add-wide">+ Aggiungi in cima</button>
            </form>
        </div>

        <div class="card-container">
            <div th:if="${#lists.isEmpty(elementiClassifica)}" class="empty-message">Nessun dato trovato</div>

			<div th:each="elementoClassifica : ${elementiClassifica}"
			     th:class="'card ' + (${elementoClassifica.posizione} == 1 ? 'gold-card' : (${elementoClassifica.posizione} == 2 ? 'silver-card' : (${elementoClassifica.posizione} == 3 ? 'bronze-card' : '')))">
                <div class="card-position" th:text="'#' + ${elementoClassifica.posizione}">#1</div>

                <div class="card-info">
                    <div class="card-images">
                        <img th:src="@{/cavalli/{id}/immagine(id=${elementoClassifica.partecipazione.cavallo.id})}" class="foto-cavallo" alt="Foto Cavallo"/>
                        <img th:src="@{/fantini/{id}/immagine(id=${elementoClassifica.partecipazione.fantino.id})}" class="foto-fantino" alt="Foto Fantino"/>
                        <img th:src="@{/urlImmagine/{id}(id=${elementoClassifica.partecipazione.contrada.id})}" class="foto-contrada" alt="Foto Contrada"/>
                    </div>

                    <div class="card-details">
                        <p><strong>Cavallo:</strong> <span th:text="${elementoClassifica.partecipazione.cavallo.nome}">Nome Cavallo</span></p>
                        <p><strong>Fantino:</strong> <span th:text="|${elementoClassifica.partecipazione.fantino.nome} ${elementoClassifica.partecipazione.fantino.cognome}|">Nome Fantino</span></p>
                        <p><strong>Contrada:</strong> <span th:text="${elementoClassifica.partecipazione.contrada.nome}">Contrada</span></p>
                    </div>
                </div>

                <div class="card-actions" sec:authorize="hasRole('ADMIN')">
                    <form th:action="@{/eliminaElementoClassifica/{id}/{idc}(id=${elementoClassifica.id}, idc=${classifica.edizioneId})}" method="post">
                        <button type="submit" class="btn btn-danger">Elimina</button>
                    </form>
                    <form th:action="@{/insElemento/{id}(id=${classifica.edizioneId})}" method="get">
                        <input type="hidden" name="posizione" th:value="${elementoClassifica.posizione}" />
                        <button type="submit" class="btn btn-add-element">+ Inserisci sotto</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Aggiungi in fondo -->
        <div class="card-controls" sec:authorize="hasRole('ADMIN')" th:if="${!#lists.isEmpty(elementiClassifica)}"
             th:with="lastPos=${elementiClassifica[elementiClassifica.size() - 1].posizione}">
            <form th:action="@{/insElemento/{id}(id=${classifica.edizioneId})}" method="get">
                <input type="hidden" name="posizione" th:value="${lastPos}" />
                <button type="submit" class="btn btn-add-wide">+ Aggiungi in fondo</button>
            </form>
        </div>
    </div>

    <!-- NON CLASSIFICATI -->
    <div class="section-wrapper no-placement-table">
        <h1 class="section-title">Partecipanti non arrivati al traguardo</h1>

        <div class="card-container">
            <div th:each="partecipazione : ${partecipazioni}" th:if="${partecipazione.elementoClassifica == null}" class="card">
                <div class="card-info">
                    <div class="card-images">
                        <img th:src="@{/cavalli/{id}/immagine(id=${partecipazione.cavallo.id})}" class="foto-cavallo" alt="Foto Cavallo"/>
                        <img th:src="@{/fantini/{id}/immagine(id=${partecipazione.fantino.id})}" class="foto-fantino" alt="Foto Fantino"/>
                        <img th:src="@{/urlImmagine/{id}(id=${partecipazione.contrada.id})}" class="foto-contrada" alt="Foto Contrada"/>
                    </div>

                    <div class="card-details">
                        <p><strong>Cavallo:</strong> <span th:text="${partecipazione.cavallo.nome}">Cavallo</span></p>
                        <p><strong>Fantino:</strong> <span th:text="|${partecipazione.fantino.nome} ${partecipazione.fantino.cognome}|">Fantino</span></p>
                        <p><strong>Contrada:</strong> <span th:text="${partecipazione.contrada.nome}">Contrada</span></p>
                        <p class="no-placement">Non ha tagliato il traguardo</p>
                    </div>
                </div>

                <div class="card-actions" sec:authorize="hasRole('ADMIN')">
                    <form th:action="@{/partecipazione/delete/{id}(id=${partecipazione.id})}">
                        <button type="submit" class="btn btn-danger">Elimina</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="section-actions" sec:authorize="hasRole('ADMIN')">
            <form th:action="@{/insPartecipazione/{id}(id=${classifica.edizione.id})}" method="get">
                <button type="submit" class="btn btn-add-wide">Inserisci Partecipazione</button>
            </form>
        </div>
    </div>
	</div>
</body>
</html>
