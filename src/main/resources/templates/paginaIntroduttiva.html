<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" th:href="@{/css/login.css}" />
    <title>Benvenuto</title>
</head>

<body>
    <main class="container">
        <h1 class="pagInt">
            Benvenuto! In questo sito potrai trovare numerose informazioni
            sulle ultime edizioni del Palio di Siena.<br />
            Se vuoi continuare, effettua il login.
        </h1>

        <div class="pagIntBox">
            <form th:action="@{/login}" method="get">
                <button type="submit" class="pagInt">Login</button>
            </form>
        </div>
    </main>
</body>

</html>
