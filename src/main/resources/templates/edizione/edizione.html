<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="it">
<head>
  <meta charset="UTF-8">
  <title>Edizione</title>
  <link rel="stylesheet" href="/css/cav.css">
</head>

<body>
  <!-- HEADER -->
  <header class="top-bar">
    <div class="header-content">
      <div class="logo-text">Palio di Siena</div>
      <div class="user-controls">
        <form th:action="@{/home}" method="get" style="display: inline;">
          <button class="btn" type="submit">Home</button>
        </form>

        <div sec:authorize="isAuthenticated()" style="display: inline;">
          <span class="user-name" th:text="${#authentication.name}">Utente</span>
          <form th:action="@{/logout}" method="post" style="display: inline;">
            <button class="btn" type="submit">Logout</button>
          </form>
        </div>

        <div sec:authorize="!isAuthenticated()" style="display: inline;">
          <form th:action="@{/login}" method="get" style="display: inline;">
            <button class="btn" type="submit">Login</button>
          </form>
        </div>
      </div>
    </div>
  </header>

  <!-- CONTENUTO -->
  <div th:if="${edizione}">
    <h1 class="uno" th:text="|Edizione del ${edizione.data}|">Edizione</h1>

    <div class="card-cavallo">
      <!-- Immagine -->
      <img th:src="@{'/edizione/' + ${edizione.id} + '/immagine'}" alt="Immagine Edizione" />

      <!-- Dati -->
     
      <div class="card-dato">
        <div class="definizione">Data Edizione</div>
        <div class="nome" th:text="${edizione.data}">01-07-2025</div>
      </div>

      <!-- Azioni -->
      <div class="azionibtn">
        <form th:action="@{/classifica/{id}(id=${edizione.id})}" method="get">
          <button type="submit" class="btn-card secondary">Vedi Classifica</button>
        </form>

        <div sec:authorize="hasRole('ADMIN')">
          <form th:action="@{/edizioni/delete/{id}(id=${edizione.id})}" method="post"
                onsubmit="return confirm('Sei sicuro di voler eliminare questa edizione?');">
            <button type="submit" class="btn-card danger">Elimina</button>
          </form>

          

          <form th:action="@{/modificaEdizione/{id}(id=${edizione.id})}" method="get">
            <button type="submit" class="btn-card secondary">Modifica</button>
          </form>
        </div>

        <div sec:authorize="isAuthenticated()">
          <div sec:authorize="!hasRole('ADMIN')">
            
          </div>
        </div>

        <form th:action="@{/commentiEdizione/{id}(id=${edizione.id})}" method="get">
          <button type="submit" class="btn-card">Vedi i commenti</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Caso: Edizione non trovata -->
  <div th:unless="${edizione}">
    <h2 class="uno">Edizione non trovata</h2>
  </div>
  <div class="center-container">
    <form th:action="@{/edizioni}" method="get">
      <button type="submit" class="btn">Vedi tutte le edizioni</button>
    </form>
  </div>

</body>
</html>
