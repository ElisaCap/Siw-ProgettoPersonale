<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <title>Registrazione conclusa - SiwMovie</title>
    <link rel="stylesheet" th:href="@{/css/login.css}" />
</head>

<body>

    <div class="login-container">
        <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
           
            <div>
                <div sec:authorize="isAuthenticated()">
                    <span th:text="${#authentication.name}">Utente</span> |
                    <a href="/logout" class="btn secondary">Logout</a>
                </div>
                <div sec:authorize="isAnonymous()">
                    <a href="/login" class="btn secondary">Login</a>
                </div>
            </div>
        </header>

        <h1 class="login-title">Congratulazioni! Ti sei registrato con successo</h1>

        <div class="login-field">
            <strong>Nome:</strong>
            <span th:text="${user.name}">Mario</span>
        </div>

        <div class="login-field">
            <strong>Cognome:</strong>
            <span th:text="${user.surname}">Rossi</span>
        </div>

        <div class="login-field">
            <strong>Email:</strong>
            <span th:text="${user.email}">mario.rossi@example.com</span>
        </div>

        <div class="login-buttons" style="margin-top: 30px;">
            <a href="/" class="btn">Torna alla Home</a>
        </div>
    </div>

</body>
</html>
