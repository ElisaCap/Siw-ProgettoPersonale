<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<link rel="stylesheet" href="/style.css">
	<title>Cerca Cavallo</title>
</head>

<body>
	<h1 class="uno">Trova Cavallo per ID</h1>
	<form th:action="@{/cavalli/cerca}" method="post">
		<label for="id">ID Cavallo:</label>
		<input type="number" name="id" required>
		<button type="submit">Cerca</button>
	</form>
	<form th:action="@{/cavalli/cercatutti}" method="post">
		<button type="submit">mostra tutti</button>
	</form>
</body>

</html>
